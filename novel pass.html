    <main>
    
    <div class="container divider" style="text-align: center;">
        <h2>Bút danh của Etar cho đến trước khi gọi là Etar là gì?</h2>
        <div class="password-gate-form"><input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." class="password-input" onkeypress="handleKeyPress(event)"><button onclick="checkPassword()" class="password-button">Xác nhận</button></div>
        <p id="passwordError" style="color: #ff8a8a; text-align: center; margin-top: 10px; display: none;"></p>
    </div>

    <script>
        function checkPassword() {
            var password = document.getElementById("passwordInput").value;
            var errorEl = document.getElementById("passwordError");
            // Kiểm tra mật khẩu
            if (password === "akitaneko") {
                if (errorEl) errorEl.style.display = "none";
                // Nếu mật khẩu đúng, chuyển hướng đến trang mong muốn
                window.location.href = "/library/novel.html";
            } else {
                // Nếu mật khẩu sai, thông báo và không chuyển hướng
                if (errorEl) {
                    errorEl.textContent = "Mật khẩu không đúng. Vui lòng thử lại.";
                    errorEl.style.display = "block";
                }
            }
        }

        function handleKeyPress(event) {
            // Kiểm tra nếu phím được nhấn là phím Enter
            if (event.key === "Enter") {
                // Gọi hàm checkPassword
                checkPassword();
            }
        }
    </script>
